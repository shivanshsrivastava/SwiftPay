spring.application.name=swiftpay
spring.datasource.username=swiftpay
spring.datasource.password=swiftpay
spring.datasource.url=jdbc:mysql://localhost:3306/swiftpay

spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

spring.jpa.hibernate.ddl-auto=validate

jwt.secret=yourVeryLongSecretKeyForJwtTokenGeneration123456789
jwt.expiration=3600000
jwt.refresh-expiration=604800000


logging.level.org.springframework.web.servlet.mvc.method.annotation.RequestMappingHandlerMapping=TRACE

spring.data.redis.host=localhost
spring.data.redis.port=6379
